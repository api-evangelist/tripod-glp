description: >-
  tripod-glp resolves to TriApex Laboratories, a next-generation pharmaceutical and biomedical
  contract research organization (CRO) headquartered in Nanjing, China with facilities in Shanghai,
  Kunming, Wenchang and Pennsylvania. TriApex provides integrated nonclinical services (safety
  assessment, efficacy, DMPK and research models) and clinical trial services across phases I-III,
  with disease expertise spanning cardiometabolic, CNS, ophthalmology, autoimmune and oncology.
  Surfaced as a portfolio company of Qiming Venture Partners and added to the API Evangelist network,
  it publishes a corporate website (www.tri-apex.com) but no public API, developer portal, or
  documentation surface at this time.
